// -------------------- 초기화 --------------------
let currentIndex = 0;
const identityScore = { NS:0, HA:0, RD:0, PS:0, SD:0, CO:0, ST:0 };

const testQuestion = document.getElementById("testQuestion");
const testAnswerList = document.getElementById("testAnswerList");
const currentQuestion = document.getElementById("currentQuestion");
const totalQuestion = document.getElementById("totalQuestion");

// 질문 랜덤 섞기
const shuffledQuestions = testQuestions.sort(() => Math.random()-0.5);
totalQuestion.textContent = shuffledQuestions.length;

const prevBtn = document.getElementById("prevQuestionBtn");
const nextBtn = document.getElementById("nextQuestionBtn");

prevBtn.addEventListener("click", () => {
  if(currentIndex > 0){
    currentIndex--;
    renderQuestion();
  }
});

nextBtn.addEventListener("click", () => {
  if(currentIndex < shuffledQuestions.length - 1){
    currentIndex++;
    renderQuestion();
  } else {
    finishTest();
  }
});

// -------------------- 질문 렌더링 --------------------
function renderQuestion(){
  const current = shuffledQuestions[currentIndex];
  currentQuestion.textContent = currentIndex + 1;
  testQuestion.textContent = current.question;
  testAnswerList.innerHTML = "";
  current.answers.forEach(answer=>{
    const btn = document.createElement("button");
    btn.className = "test-answer-btn tap";
    btn.textContent = answer.text;
    btn.addEventListener("click", ()=>{
      identityScore[current.type] += answer.score;
      currentIndex++;
      if(currentIndex >= shuffledQuestions.length){
        finishTest();
      } else {
        renderQuestion();
      }
    });
    testAnswerList.appendChild(btn);
  });
}

// -------------------- 테스트 종료 --------------------
function finishTest(){
  localStorage.setItem("userIdentity", JSON.stringify(identityScore));

  const popup = document.getElementById("testCompletePopup");
  popup.classList.add("show");

  // 2초 후 사라지면서 MY 탭으로 이동
  setTimeout(() => {
    popup.classList.remove("show");

    // 페이지 전환
    pages.forEach(p => p.classList.remove("active"));
    document.getElementById("homePage").classList.add("active");

    // 하단 탭도 홈 활성화
    tabs.forEach(t => t.classList.remove("active"));
    document.querySelector('.bottom-tab .tab[data-page="homePage"]').classList.add("active");
  }, 1800);
}
// -------------------- 시작 --------------------
renderQuestion();
