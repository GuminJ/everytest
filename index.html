<script>
// -------------------- 탭 이동 --------------------
const tabs = document.querySelectorAll(".tab");
const pages = document.querySelectorAll(".page");
const mainContent = document.querySelector(".main-content");

tabs.forEach(tab => {
  tab.addEventListener("click", () => {
    tabs.forEach(t => t.classList.remove("active"));
    pages.forEach(p => p.classList.remove("active"));

    tab.classList.add("active");

    const target = tab.dataset.page;
    document.getElementById(target).classList.add("active");

    mainContent.scrollTo({
      top: 0,
      behavior: "smooth"
    });
  });
});

// -------------------- 눌림 효과 --------------------
document.querySelectorAll(".tap").forEach(btn => {
  btn.addEventListener("click", () => {
    btn.classList.add("selected");

    setTimeout(() => {
      btn.classList.remove("selected");
    }, 150);
  });
});

// -------------------- Storage Key --------------------
const STORAGE_KEYS = {
  POINT: "point",
  MOOD: "weekMood",
  WEEK_KEY: "weekKey",
  PROFILE: "profileImage",
  ALERT: "newTestAlert"
};

// -------------------- 프로필 이미지 --------------------
const profileInput = document.getElementById("profileInput");
const profileImage = document.getElementById("profileImage");

const savedProfile = localStorage.getItem(STORAGE_KEYS.PROFILE);

if(savedProfile){
  profileImage.src = savedProfile;
}

profileInput.addEventListener("change", e => {
  const file = e.target.files[0];

  if(!file) return;

  const reader = new FileReader();

  reader.onload = event => {
    profileImage.src = event.target.result;

    localStorage.setItem(
      STORAGE_KEYS.PROFILE,
      event.target.result
    );
  };

  reader.readAsDataURL(file);
});

// -------------------- 포인트 시스템 --------------------
const pointText = document.getElementById("pointText");
const pointPopup = document.getElementById("pointPopup");

let point = Number(
  localStorage.getItem(STORAGE_KEYS.POINT)
) || 0;

updatePointUI();

function addPoint(amount){
  point += amount;

  localStorage.setItem(
    STORAGE_KEYS.POINT,
    point
  );

  updatePointUI();
  showPointPopup(`+${amount}PT`);
}

function updatePointUI(){
  pointText.textContent = `${point}PT`;
}

function showPointPopup(text){
  pointPopup.textContent = text;

  pointPopup.style.opacity = "1";

  setTimeout(() => {
    pointPopup.style.opacity = "0";
  }, 1600);
}

// -------------------- 감정 기록 --------------------
const moodButtons = document.querySelectorAll(".mood-btn");
const weekMoodBox = document.getElementById("weekMoodBox");
const weekGrid = document.getElementById("weekGrid");

const currentWeekKey = getCurrentWeekKey(new Date());

const savedWeekKey = localStorage.getItem(
  STORAGE_KEYS.WEEK_KEY
);

let savedMoodData = {};

// 주차 변경 시 초기화
if(savedWeekKey !== currentWeekKey){

  localStorage.removeItem(STORAGE_KEYS.MOOD);

  localStorage.setItem(
    STORAGE_KEYS.WEEK_KEY,
    currentWeekKey
  );

} else {

  savedMoodData = JSON.parse(
    localStorage.getItem(STORAGE_KEYS.MOOD)
  ) || {};
}

// 감정 기록
moodButtons.forEach(button => {

  button.addEventListener("click", () => {

    const todayKey = getDateKey(new Date());

    const alreadyChecked =
      !!savedMoodData[todayKey];

    savedMoodData[todayKey] = {
      mood: button.textContent,
      createdAt: Date.now()
    };

    localStorage.setItem(
      STORAGE_KEYS.MOOD,
      JSON.stringify(savedMoodData)
    );

    renderWeekMood();

    weekMoodBox.style.display = "block";

    if(!alreadyChecked){
      addPoint(10);
    }

    // 오늘 선택 버튼 표시
    moodButtons.forEach(btn =>
      btn.classList.remove("active")
    );

    button.classList.add("active");
  });
});

// 주간 렌더링
function renderWeekMood(){

  weekGrid.innerHTML = "";

  const startOfWeek =
    getStartOfWeek(new Date());

  const dayNames =
    ["일","월","화","수","목","금","토"];

  const todayKey =
    getDateKey(new Date());

  for(let i = 0; i < 7; i++){

    const date = new Date(startOfWeek);

    date.setDate(
      startOfWeek.getDate() + i
    );

    const key = getDateKey(date);

    const mood =
      savedMoodData[key]?.mood || "➖";

    const item =
      document.createElement("div");

    item.className = "week-item";

    if(key === todayKey){
      item.classList.add("today");
    }

    item.innerHTML = `
      <div class="week-day">
        ${dayNames[i]}
      </div>

      <div class="week-emoji">
        ${mood}
      </div>
    `;

    weekGrid.appendChild(item);
  }
}

// -------------------- 날짜 함수 --------------------
function getStartOfWeek(date){

  const d = new Date(date);

  const day = d.getDay();

  d.setDate(d.getDate() - day);

  return d;
}

function getDateKey(date){

  return `${date.getFullYear()}-${
    date.getMonth() + 1
  }-${
    date.getDate()
  }`;
}

function getCurrentWeekKey(date){

  return getDateKey(
    getStartOfWeek(date)
  );
}

// -------------------- 초기 렌더 --------------------
if(Object.keys(savedMoodData).length > 0){

  weekMoodBox.style.display = "block";

  renderWeekMood();

  // 오늘 기록한 mood 버튼 active 처리
  const todayMood =
    savedMoodData[
      getDateKey(new Date())
    ]?.mood;

  if(todayMood){

    moodButtons.forEach(btn => {

      if(btn.textContent === todayMood){

        btn.classList.add("active");
      }
    });
  }
}

// -------------------- 토글 스위치 --------------------
const toggle =
  document.querySelector(".toggle-switch");

let toggleState =
  localStorage.getItem(STORAGE_KEYS.ALERT)
  === "on";

if(toggleState){
  toggle.classList.add("active");
}

toggle.addEventListener("click", () => {

  toggleState = !toggleState;

  toggle.classList.toggle("active");

  localStorage.setItem(
    STORAGE_KEYS.ALERT,
    toggleState ? "on" : "off"
  );
});
</script>
