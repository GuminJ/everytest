<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
<title>MY LittleMonster</title>
<link rel="stylesheet" href="style.css" />
<link
  rel="stylesheet"
  as="style"
  crossorigin
  href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard/dist/web/static/pretendard.css"
/>
</head>
<body>
<div class="app">

  <!-- 헤더 -->
  <header class="top-header" id="topHeader">
    <div>
      <h1 class="logo">MY LittleMonster</h1>
      <p class="subtitle">심리테스트로 만드는<br>나의 정체성</p>
      <button class="start-btn" onclick="location.href='test-myMonster.html'">테스트 시작하기</button>
    </div>
    <div class="profile-wrap">
      <label class="profile-mini">
        <img id="profileImage" src="images/default-profile.png" alt="프로필"/>
        <input type="file" id="profileInput" accept="image/*"/>
      </label>
      <div class="point-badge">
        <span id="pointText">0PT</span>
      </div>
    </div>
  </header>

  <!-- 메인 -->
  <main class="main-content">
    <!-- 홈 페이지 -->
    <section class="page active" id="homePage">
      <div class="section-title">🔥 인기 테스트</div>
      <div class="card-list">
        <div class="test-card tap"><div class="emoji">🍚</div><div class="card-info"><h3>식사 유형</h3></div></div>
        <div class="test-card tap"><div class="emoji">💘</div><div class="card-info"><h3>연애 테스트</h3></div></div>
        <div class="test-card tap"><div class="emoji">🌙</div><div class="card-info"><h3>감각 테스트</h3></div></div>
      </div>
      <div class="mood-box">
        <div class="section-title">🌈 오늘 기분 기록</div>
        <div class="mood-list">
          <button class="mood-btn tap">😊</button>
          <button class="mood-btn tap">😴</button>
          <button class="mood-btn tap">🥹</button>
          <button class="mood-btn tap">😎</button>
          <button class="mood-btn tap">🥺</button>
          <button class="mood-btn tap">😡</button>
        </div>
        <div class="week-mood-box" id="weekMoodBox">
          <div class="week-grid" id="weekGrid"></div>
        </div>
      </div>
    </section>

    <!-- 탐색 페이지 -->
    <section class="page" id="explorePage">
      <div class="section-title">🧠 카테고리 탐색</div>
      <div class="category-grid">
        <div class="category-card tap popular">🔥<span>인기</span></div>
        <div class="category-card tap love">💘<span>연애</span></div>
        <div class="category-card tap personality">🧠<span>성격</span></div>
        <div class="category-card tap relation">👥<span>관계</span></div>
        <div class="category-card tap work">💼<span>직장</span></div>
        <div class="category-card tap emotion">🌙<span>감성</span></div>
        <div class="category-card tap taste">🎨<span>취향</span></div>
      </div>
    </section>

    <!-- MY 페이지 -->
    <section class="page" id="myPage">
      <div class="my-monster-card">
        <div class="monster-info">
          <div class="monster-main-type" id="monsterMainType">타입</div>
          <div class="monster-sub-type" id="monsterSubType">보조 타입</div>
          <div class="monster-desc" id="monsterDesc">캐릭터 설명</div>
          <div class="monster-advice" id="monsterAdvice">조언</div>
        </div>
        <img src="images/default-monster.png" alt="my monster" class="monster-image" id="monsterImage"/>
      </div>
      <div class="analysis-box">
        <div class="section-title">📊 정체성 분석</div>
        <canvas id="radarChart" class="radar-canvas" style="width:100%; max-width:400px; height:300px;"></canvas>
      </div>
      <div class="advice-box">
        <div class="section-title">💡 오늘의 조언</div>
        <p id="monsterAdvice">테스트 후 자동 업데이트</p>
      </div>
    </section>

    <!-- 설정 페이지 -->
    <section class="page" id="settingPage">
      <div class="setting-card">
        <div><h3>⚙️ 앱 버전</h3><p>0.0.1</p></div>
      </div>
    </section>
  </main>

  <!-- 하단 탭 -->
  <nav class="bottom-tab">
    <button class="tab active" data-page="homePage">🏠<small>홈</small></button>
    <button class="tab" data-page="explorePage">🔍<small>탐색</small></button>
    <button class="tab" data-page="myPage">👾<small>MY</small></button>
    <button class="tab" data-page="settingPage">⚙️<small>설정</small></button>
  </nav>
</div>

<!-- Chart.js -->
<script src="https://cdn.jsdelivr.net/npm/chart.js"></script>

<script>
// -------------------- 캐릭터 매핑 --------------------
const characterMap = [
  { type: "도파민감각", name: "화로", desc: "에너제틱하고, 모험가형", image: "images/fire-monster.png", advice:"오늘은 새로운 도전을!" },
  { type: "불안레이더", name: "몽실몽", desc: "조심/세심, 신중한 타입", image: "images/anxiety-monster.png", advice:"천천히 계획하세요." },
  { type: "마음연결력", name: "러브링", desc: "사회적 공감, 다정한 타입", image: "images/love-monster.png", advice:"관심과 배려를 보여주세요." },
  { type: "버티는힘", name: "둔둔두", desc: "끈기, 인내력 있는 타입", image: "images/persistence-monster.png", advice:"끝까지 밀어붙이세요." },
  { type: "나만의중심", name: "비트루", desc: "자율적, 주체적 타입", image: "images/center-monster.png", advice:"스스로 결정하세요." },
  { type: "공감온도", name: "온츄", desc: "배려심, 협력 중심 타입", image: "images/empathy-monster.png", advice:"함께 해결해보세요." },
  { type: "몽상감도", name: "달몽", desc: "상상력, 창의 중심 타입", image: "images/dream-monster.png", advice:"아이디어를 펼쳐보세요." },
  { type: "균형형", name: "슈르", desc: "균형형, 편안한 타입", image: "images/balance-monster.png", advice:"여유롭게 보내세요." }
];

// -------------------- 탭 이동 --------------------
const tabs = document.querySelectorAll(".tab");
const pages = document.querySelectorAll(".page");
const mainContent = document.querySelector(".main-content");

tabs.forEach(tab => {
  tab.addEventListener("click", () => {
    tabs.forEach(t => t.classList.remove("active"));
    pages.forEach(p => p.classList.remove("active"));
    tab.classList.add("active");
    const targetPage = document.getElementById(tab.dataset.page);
    if(targetPage) targetPage.classList.add("active");
    mainContent.scrollTo({ top: 0, behavior: "smooth" });
  });
});

// -------------------- 눌림 효과 --------------------
document.querySelectorAll(".tap:not(.tab)").forEach(btn => {
  btn.addEventListener("click", () => {
    btn.classList.add("selected");
    setTimeout(() => btn.classList.remove("selected"), 150);
  });
});

// -------------------- Radar 차트 예시 --------------------
const radarCtx = document.getElementById("radarChart");
if(radarCtx){
  new Chart(radarCtx, {
    type: 'radar',
    data: {
      labels: ['도파민', '불안', '공감', '인내', '자율', '상상', '균형'],
      datasets: [{
        label: '나의 점수',
        data: [80, 65, 75, 90, 50, 60, 70],
        backgroundColor: 'rgba(255,99,132,0.2)',
        borderColor: 'rgba(255,99,132,1)',
        borderWidth: 2
      }]
    },
    options: {
      scales: {
        r: { beginAtZero:true, max:100 }
      }
    }
  });
}

// -------------------- 포인트 + 프로필 예시 --------------------
let point = 0;
const pointText = document.getElementById("pointText");
document.getElementById("profileInput").addEventListener("change", e=>{
  const file = e.target.files[0];
  if(file){
    document.getElementById("profileImage").src = URL.createObjectURL(file);
    point += 10;
    pointText.textContent = point + "PT";
  }
});
</script>
</body>
</html>
